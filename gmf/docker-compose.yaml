# The project Docker compose file.

volumes:
  postgresql_data:

services:
  config:
    extends:
      file: docker-compose-lib.yaml
      service: config

  print:
    extends:
      file: docker-compose-lib.yaml
      service: print
    volumes_from:
      - config:ro

  qgisserver:
    extends:
      file: docker-compose-lib.yaml
      service: qgisserver
    volumes_from:
      - config:ro
    environment:
      - QGIS_SERVER_LANDING_PAGE_PROJECTS_DIRECTORIES=/etc/qgisserver/
      # Or
      - QGIS_SERVER_LANDING_PAGE_PROJECTS_PG_CONNECTIONS=...
      # With TRUE, the OGC API Features items fail with "Offset for features to retrieve [0--1]"
      - QGIS_SERVER_TRUST_LAYER_METADATA=FALSE
    # The plugin reads the OGC servers at startup
    depends_on:
      prepare_data:
        condition: service_completed_successfully

  # Bare QGIS Server (without the GeoMapFish plugin), to compare with the qgisserver service
  qgisserver-bare:
    image: camptocamp/qgis-server:master
    user: www-data
    restart: unless-stopped
    volumes_from:
      - config:ro
    environment:
      - PGSERVICEFILE
      - QGIS_PROJECT_FILE=/etc/qgisserver/project.qgs
      - QGIS_SERVER_LOG_LEVEL
      - QGIS_SERVER_IGNORE_BAD_LAYERS
      - QGIS_SERVER_TRUST_LAYER_METADATA=FALSE
      - QGIS_SERVER_API_WFS3_MAX_LIMIT
      - QGIS_SERVER_OVERRIDE_SYSTEM_LOCALE
    ports:
      - 8485:8080

  # Standalone version
  redis:
    extends:
      file: docker-compose-lib.yaml
      service: redis

  # To test Kubernetes version
  # redis_master:
  #   extends:
  #     file: docker-compose-lib.yaml
  #     service: redis_master
  #
  # redis_slave:
  #   extends:
  #     file: docker-compose-lib.yaml
  #     service: redis_slave
  #   depends_on:
  #     - redis_master
  #
  # redis_sentinel:
  #   extends:
  #     file: docker-compose-lib.yaml
  #     service: redis_sentinel
  #   depends_on:
  #     - redis_master

  geoportal:
    extends:
      file: docker-compose-lib.yaml
      service: geoportal
    volumes_from:
      - config:ro
    volumes:
      - /var/sig:/var/sig:ro
    depends_on:
      prepare_data:
        condition: service_completed_successfully

  alembic:
    extends:
      file: docker-compose-lib.yaml
      service: alembic
    command:
      - sh
      - -c
      - >-
        python -c "import psycopg2; c = psycopg2.connect(''); c.autocommit = True;
        c.cursor().execute('CREATE EXTENSION IF NOT EXISTS postgis; CREATE EXTENSION IF NOT EXISTS hstore;
        CREATE SCHEMA IF NOT EXISTS ${PGSCHEMA}; CREATE SCHEMA IF NOT EXISTS ${PGSCHEMA_STATIC}')"
        && alembic --name=main upgrade head
        && alembic --name=static upgrade head
    depends_on:
      db:
        condition: service_healthy

  # Load the demo data and the GeoMapFish admin configuration from ../data/gmf_data.sql,
  # only if the demo schema doesn't exist
  prepare_data:
    image: ghcr.io/camptocamp/postgres:${POSTGRES_TAG}
    environment:
      - PGHOST
      - PGPORT
      - PGUSER
      - PGPASSWORD
      - PGDATABASE
    volumes:
      - ../data:/data:ro
    command:
      - sh
      - -c
      - |
        if [ "$$(psql --tuples-only --no-align --command="SELECT count(*) FROM pg_namespace WHERE nspname = 'demo'")" = 1 ]; then
          echo 'Data already loaded'
        else
          psql --set=ON_ERROR_STOP=1 --single-transaction --file=/data/gmf_data.sql
        fi
    depends_on:
      alembic:
        condition: service_completed_successfully

  front:
    extends:
      file: docker-compose-lib.yaml
      service: front
    volumes_from:
      - config:ro

  # Rich image for project development with e.-g. vim, psql, ...
  tools:
    extends:
      file: docker-compose-lib.yaml
      service: tools
    volumes_from:
      - config:ro

  db:
    extends:
      file: docker-compose-lib.yaml
      service: db
    volumes:
      - ./postgres_data:/var/lib/postgresql
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready --host=localhost --username=$${POSTGRES_USER} --dbname=$${POSTGRES_DB}
      interval: 2s
      retries: 30
